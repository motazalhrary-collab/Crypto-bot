
name: Hourly Crypto Bot

on:
  schedule:
    - cron: '0 * * * *'  # يعمل تلقائياً في الدقيقة صفر من كل ساعة
  workflow_dispatch:      # يتيح لك زراً لتشغيله يدوياً للتجربة متى شئت

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install ccxt pandas requests

      - name: Run script
        run: python bot.py
